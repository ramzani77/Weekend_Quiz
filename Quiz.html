<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Family Poll 😜</title>
<h2>Testing PR workflow</h2>

<style>
body {
  
  margin: 0;
  height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #89f7fe, #66a6ff);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.card {
  background: white;
  padding: 30px 25px;
  width: 330px;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 15px 35px rgba(0,0,0,0.2);
}

.emoji {
  font-size: 48px;
}

h2 {
  color: #333;
  
}


p {
  color: #555;
  font-size: 14px;
}

.buttons {
  margin-top: 25px;
  position: relative;
  height: 120px;
}

button {
  padding: 12px 22px;
  border: none;
  border-radius: 25px;
  font-size: 16px;
  cursor: pointer;
  position: absolute;
}

#yes {
  background: #4CAF50;
  color: white;
  left: 30px;
  top: 40px;
}

#no {
  background: #eee;
  color: #555;
  right: 30px;
  top: 40px;
}
</style>
</head>

<body>

<div class="card">
  <div class="emoji">🤔</div>

  <h2>Family Question Time!</h2>
  <p>Answer honestly 😝</p>

  <h2>Is Sameer the most entertaining person in this family? 😎</h2>

  <div class="buttons">
    <button id="yes" onclick="yesClicked()">Yes 😁</button>
    <button id="no">No 🙄</button>
  </div>
</div>

<script>
const noBtn = document.getElementById("no");
const container = document.querySelector(".buttons");

/* ESCAPE LOGIC – works for mouse + touch */
function moveNoButton() {
  const maxX = container.clientWidth - noBtn.offsetWidth;
  const maxY = container.clientHeight - noBtn.offsetHeight;

  const randomX = Math.random() * maxX;
  const randomY = Math.random() * maxY;

  noBtn.style.left = randomX + "px";
  noBtn.style.top = randomY + "px";
}

/* Desktop */
noBtn.addEventListener("mouseenter", moveNoButton);

/* Mobile */
noBtn.addEventListener("touchstart", function(e) {
  e.preventDefault();
  moveNoButton();
});

function yesClicked() {
  document.body.innerHTML = `
    <div style="
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
      text-align:center;
      font-family:Arial;
      padding:20px;
    ">
      <div style="
        background:white;
        padding:30px;
        border-radius:25px;
        box-shadow:0 15px 35px rgba(0,0,0,0.2);
      ">
        <h1>Correct Answer 😂👏</h1>
        <p>
          You tried clicking No…<br>
          but honesty won 😎🔥<br><br>
          Screenshot this and send proof 📸
        </p>
      </div>
    </div>
  `;
}
</script>

</body>
</html>
